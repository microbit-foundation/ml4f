  <!-- Heads up: runBrowser compiles with optimize:false, which trips a
       pre-existing assertion in the unoptimized IR path (and float16 tolerance
       edges on some seeds). It fails identically under Node, so it is not a
       browser/module problem. The maintained gate is `npm test` (optimize:true);
       this page is kept as a browser playground. -->
  <script type="module">
    import { runBrowser } from './built/ml4f.js'
    const seed = parseInt(new URLSearchParams(location.search).get('seed')) || 0
    runBrowser(seed)
  </script>
