name: build
on:
  release:
    types: [created]
  push:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@11.18.0
      - uses: microbit-foundation/npm-package-versioner-action@v3
      - run: npm ci
      - run: npm run build
      - run: npm test
      # --allow-directory=all is required because the committed .npmrc sets
      # allow-directory=root for install hardening, but npm pack/publish fail
      # under `root` (it resolves the package itself as a non-root directory).
      - run: npm publish --allow-directory=all
        if: github.event_name == 'release' && github.event.action == 'created'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
